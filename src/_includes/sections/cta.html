<!--                   Subscribe                  -->
<!-- ============================================ -->

<section id="subscribe-2143">
	<div class="cs-container">
		<div class="cs-image-group">
			<!--Main Image-->
			<picture class="cs-picture">
				<!--Mobile Image-->
				<source
					media="(max-width: 600px)"
					srcset="/assets/images/cta-chef.png"
				/>
				<!--Tablet and above Image-->
				<source
					media="(min-width: 601px)"
					srcset="/assets/images/cta-chef.png"
				/>
				<img
					loading="lazy"
					decoding="async"
					src="/assets/images/cta-chef.png"
					alt="wedding bride"
					width="396"
					height="570"
				/>
			</picture>
			<!--Color Wheel-->
			<img
				class="cs-wheel"
				loading="lazy"
				decoding="async"
				src="/assets/images/logo.png"
				alt="color wheel"
				width="542"
				height="542"
				aria-hidden="true"
			/>
		</div>
		<div class="cs-content">
			<span class="cs-topper"
				>There's No Address. You Have to Be Invited</span
			>
			<h2 class="cs-title">
				Want to experience the best pizza of your life?
			</h2>
			<p class="cs-text">
				Weekends only, when the weather and the wood cooperate. Leave us
				your email, when the event is scheduled, we'll send you an
				invite. Never any spam or junk, just an invite when the fire is
				going.
			</p>
			<form class="cs-form" name="Contact Form" method="post">
				<input
					class="cs-input"
					type="email"
					id="cs-email-2143"
					name="find-us"
					placeholder="Enter your email"
					required
				/>
				<button class="cs-button-solid cs-submit" type="submit">
					Subscribe
				</button>
			</form>
		</div>
	</div>
</section>
